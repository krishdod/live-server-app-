name: Build desktop viewer

on:
  workflow_dispatch:
  push:
    branches: ["codex/**"]
    paths:
      - "desktop-viewer/**"
      - "server/**"
      - ".github/workflows/build-viewer.yml"
    tags: ["viewer-v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            desktop-viewer/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: desktop-viewer
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: desktop-viewer
      - run: npm test
        working-directory: server
      - name: Check native rendering and streaming
        run: npm run test:smoke
        working-directory: desktop-viewer
      - name: Build Windows installer and portable app
        if: runner.os == 'Windows'
        run: npm run dist
        working-directory: desktop-viewer
      - name: Build bundled Mac DMG and ZIP
        if: runner.os == 'macOS'
        run: npm run dist:mac -- -c.mac.identity=-
        working-directory: desktop-viewer
      - name: Verify universal Mac executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict "releases/mac-universal/Live Workspace Viewer.app"
          lipo "releases/mac-universal/Live Workspace Viewer.app/Contents/MacOS/Live Workspace Viewer" -verify_arch x86_64 arm64
      - name: Check packaged Mac renderer launches
        if: runner.os == 'macOS'
        shell: bash
        run: |
          task_app="$PWD/releases/mac-universal/Live Workspace Viewer.app/Contents/MacOS/Live Workspace Viewer"
          task_data="$(mktemp -d)"
          "$task_app" --user-data-dir="$task_data" > "$RUNNER_TEMP/mac-viewer-launch.log" 2>&1 &
          task_pid=$!
          trap 'kill "$task_pid" 2>/dev/null || true' EXIT
          for task_attempt in $(seq 1 30); do
            if ! kill -0 "$task_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/mac-viewer-launch.log"
              exit 1
            fi
            if pgrep -P "$task_pid" -f -- '--type=renderer' > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/mac-viewer-launch.log"
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: viewer-${{ runner.os }}
          if-no-files-found: error
          path: |
            releases/*.exe
            releases/*.dmg
            releases/*-mac-universal.zip
          retention-days: 30
