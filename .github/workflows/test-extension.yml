name: Test extension and relay

on:
  push:
    branches: ["main"]
    paths:
      - "*.js"
      - "manifest.json"
      - "package*.json"
      - "tests/**"
      - "server/**"
      - ".github/workflows/test-extension.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "*.js"
      - "manifest.json"
      - "package*.json"
      - "tests/**"
      - "server/**"
      - ".github/workflows/test-extension.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm test
