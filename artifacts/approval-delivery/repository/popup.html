<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Workspace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      padding: 14px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f0f0f;
      color: #e8eaed;
    }
    h1 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .label { color: #9ca3af; }
    .value { color: #e5e7eb; text-align: right; word-break: break-all; max-width: 180px; }
    .ok { color: #4ade80; }
    .bad { color: #f87171; }
    .muted { color: #6b7280; }
    button {
      width: 100%;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: #1e3a5f;
      color: #93c5fd;
    }
    button:hover { background: #254a75; }
    button.secondary { background: #1a1a1a; color: #d1d5db; }
    .hint { margin-top: 10px; font-size: 11px; color: #6b7280; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Live Workspace</h1>
  <div class="row"><span class="label">Server</span><span id="server" class="value muted">—</span></div>
  <div class="row"><span class="label">Health</span><span id="health" class="value muted">Checking…</span></div>
  <div class="row"><span class="label">Last sent</span><span id="lastSent" class="value muted">—</span></div>
  <div class="row"><span class="label">Queue</span><span id="queue" class="value muted">0</span></div>
  <button id="testBtn" type="button">Test server</button>
  <button id="wakeBtn" class="secondary" type="button">Wake server</button>
  <p class="hint">Open ChatGPT or Perplexity with Auto Copy ON in the viewer to stream answers live.</p>
  <script src="popup.js"></script>
</body>
</html>
